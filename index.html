<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tattoo Concept | Catálogo Oficial de Insumos</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.04) 0%, transparent 40%);
      background-attachment: fixed;
      padding-bottom: 100px;
    }

    /* Sticky Header & Search */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      background: rgba(9, 13, 22, 0.85);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 24px;
    }

    .header-container {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-bar {
      flex: 1;
      max-width: 500px;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      padding: 12px 18px 12px 42px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 99px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s;
    }

    .search-bar input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
      background: rgba(255, 255, 255, 0.08);
    }

    .cart-btn-trigger {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 99px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: transform 0.2s;
    }

    .cart-btn-trigger:hover { transform: scale(1.04); }

    /* Main Container */
    .container { max-width: 1300px; margin: 30px auto; padding: 0 20px; }

    /* Brand Header Banner */
    .brand-banner {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
    }

    .brand-title { font-size: 1.6rem; font-weight: 800; color: #fff; }
    .brand-desc { font-size: 0.88rem; color: var(--text-muted); margin-top: 4px; }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }

    /* Product Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(16, 185, 129, 0.3);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
    }

    .card.out-of-stock {
      opacity: 0.65;
    }

    /* Badges */
    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 12px;
      width: fit-content;
    }

    .badge-status.in-stock {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-status.out-of-stock {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .sku-tag { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .prod-title { font-size: 1.05rem; font-weight: 700; color: #fff; margin: 6px 0 14px; line-height: 1.3; }

    /* Type Switcher (Caja vs Unidad) */
    .switch-container {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 14px;
    }

    .switch-btn {
      flex: 1;
      padding: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .switch-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    /* Price Table Box */
    .price-box {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .price-row:not(:last-child) { border-bottom: 1px dashed rgba(255, 255, 255, 0.06); }

    .price-label { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }
    .price-val { font-size: 1.05rem; font-weight: 800; color: #fff; }
    .price-val.mayor { color: var(--gold); }

    /* Action Buttons */
    .add-cart-btn {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .add-cart-btn:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
    }

    .add-cart-btn:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    /* Cart Sidebar Modal */
    .cart-drawer {
      position: fixed;
      top: 0; right: -420px;
      width: 100%; max-width: 400px;
      height: 100vh;
      background: #0f172a;
      border-left: 1px solid var(--card-border);
      z-index: 200;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -10px 0 40px rgba(0,0,0,0.8);
    }

    .cart-drawer.open { right: 0; }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
    }

    .close-cart { background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; }

    .cart-items { flex: 1; overflow-y: auto; margin: 20px 0; }
    
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .payment-methods {
      margin-bottom: 15px;
    }

    .payment-methods label { font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 6px; }

    .payment-select {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: #fff;
      border-radius: 8px;
      outline: none;
    }

    .checkout-btn {
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: #fff;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <div class="logo-title">TATTOO CONCEPT</div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar por referencia, marca o tipo de cartucho..." oninput="filtrarProductos()">
      </div>
      <button class="cart-btn-trigger" onclick="toggleCart()">
        🛒 Carrito (<span id="cartCount">0</span>)
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container" id="mainContainer">
    <!-- Renderizado Dinámico de Marcas y Productos -->
  </div>

  <!-- Cart Drawer -->
  <div class="cart-drawer" id="cartDrawer">
    <div>
      <div class="cart-header">
        <h3>Tu Pedido</h3>
        <button class="close-cart" onclick="toggleCart()">✕</button>
      </div>
      <div class="cart-items" id="cartItems">
        <p style="color: var(--text-muted); text-align: center; margin-top: 40px;">El carrito está vacío.</p>
      </div>
    </div>

    <div>
      <div class="payment-methods">
        <label>Método de pago preferido:</label>
        <select id="paymentMethod" class="payment-select">
          <option value="Nequi / Daviplata">Nequi / Daviplata</option>
          <option value="Bancolombia">Transferencia Bancolombia</option>
          <option value="Efectivo / Contraentrega">Efectivo / Contraentrega</option>
        </select>
      </div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: 800; font-size: 1.1rem;">
        <span>Total Estimado:</span>
        <span id="cartTotal" style="color: var(--accent);">$0</span>
      </div>
      <button class="checkout-btn" onclick="enviarPedidoWhatsApp()">
        Pedir por WhatsApp 🚀
      </button>
    </div>
  </div>

  <script src="products.js"></script>
  <script>
    let carrito = [];
    let statePresentacion = {}; // Guardar selección (caja u unidad) por producto SKU

    function init() {
      renderCatalogo();
    }

    function renderCatalogo(filtro = '') {
      const container = document.getElementById('mainContainer');
      container.innerHTML = '';

      for (let sec in DB) {
        for (let brand in DB[sec]) {
          const prods = DB[sec][brand].filter(p => 
            p.n.toLowerCase().includes(filtro.toLowerCase()) || 
            p.s.toLowerCase().includes(filtro.toLowerCase())
          );

          if (prods.length === 0) continue;

          const brandInfo = (BRAND_INFO[brand]) ? BRAND_INFO[brand] : { desc: 'Insumos de alta calidad para tatuaje profesional.' };

          // Render Banner de Marca
          const sectionHtml = document.createElement('div');
          sectionHtml.innerHTML = `
            <div class="brand-banner">
              <div>
                <div class="brand-title">${brand}</div>
                <div class="brand-desc">${brandInfo.desc || 'Productos profesionales'}</div>
              </div>
            </div>
            <div class="product-grid" id="grid-${brand}"></div>
          `;
          container.appendChild(sectionHtml);

          const grid = document.getElementById(`grid-${brand}`);

          prods.forEach(p => {
            const stock = p.stock || 0;
            const tieneStock = stock > 0;
            const esAgotadoClass = tieneStock ? '' : 'out-of-stock';
            
            // Determinar si es cartucho/aguja para habilitar Switch
            const esCartucho = p.pUnidadDetal !== undefined || p.n.toUpperCase().includes('CARTUCHO') || p.n.toUpperCase().includes('WJX') || p.n.toUpperCase().includes('ILUX');
            
            if (!statePresentacion[p.s]) {
              statePresentacion[p.s] = 'caja'; // Por defecto Caja x20
            }

            const card = document.createElement('div');
            card.className = `card ${esAgotadoClass}`;
            card.id = `card-${p.s}`;

            card.innerHTML = `
              <div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <span class="sku-tag">${p.s}</span>
                  <span class="badge-status ${tieneStock ? 'in-stock' : 'out-of-stock'}">
                    ${tieneStock ? `● Disponible (${stock})` : '● Agotado'}
                  </span>
                </div>
                <div class="prod-title">${p.n}</div>

                ${esCartucho ? `
                  <div class="switch-container">
                    <button class="switch-btn ${statePresentacion[p.s] === 'caja' ? 'active' : ''}" onclick="setPresentacion('${p.s}', 'caja')">📦 Caja (x20)</button>
                    <button class="switch-btn ${statePresentacion[p.s] === 'unidad' ? 'active' : ''}" onclick="setPresentacion('${p.s}', 'unidad')">📍 Unidad</button>
                  </div>
                ` : ''}

                <div class="price-box" id="price-box-${p.s}">
                  ${getPriceHtml(p, statePresentacion[p.s])}
                </div>
              </div>

              <button class="add-cart-btn" ${!tieneStock ? 'disabled' : ''} onclick="agregarAlCarrito('${p.s}')">
                ${tieneStock ? '＋ Agregar al Pedido' : 'Sin Stock Disponible'}
              </button>
            `;

            grid.appendChild(card);
          });
        }
      }
    }

    function getPriceHtml(p, pres) {
      let detal = p.p || 0;
      let mayor = p.pMayor || Math.round(detal * 0.85);

      if (pres === 'unidad' && p.pUnidadDetal) {
        detal = p.pUnidadDetal;
        mayor = p.pUnidadMayor || Math.round(detal * 0.84);
      }

      return `
        <div class="price-row">
          <span class="price-label">DETAL:</span>
          <span class="price-val">$${detal.toLocaleString('es-CO')}</span>
        </div>
        <div class="price-row">
          <span class="price-label">MAYOR (10+):</span>
          <span class="price-val mayor">$${mayor.toLocaleString('es-CO')}</span>
        </div>
      `;
    }

    function setPresentacion(sku, pres) {
      statePresentacion[sku] = pres;
      
      // Buscar producto
      let pObj = null;
      for (let sec in DB) {
        for (let brand in DB[sec]) {
          let found = DB[sec][brand].find(item => item.s === sku);
          if (found) { pObj = found; break; }
        }
      }

      if (pObj) {
        document.getElementById(`price-box-${sku}`).innerHTML = getPriceHtml(pObj, pres);
        // Actualizar estados de botones en la tarjeta
        const card = document.getElementById(`card-${sku}`);
        const btns = card.querySelectorAll('.switch-btn');
        btns.forEach(b => b.classList.remove('active'));
        if (pres === 'caja') btns[0]?.classList.add('active');
        if (pres === 'unidad') btns[1]?.classList.add('active');
      }
    }

    function filtrarProductos() {
      const text = document.getElementById('searchInput').value;
      renderCatalogo(text);
    }

    function toggleCart() {
      document.getElementById('cartDrawer').classList.toggle('open');
    }

    function agregarAlCarrito(sku) {
      let pObj = null;
      for (let sec in DB) {
        for (let brand in DB[sec]) {
          let found = DB[sec][brand].find(item => item.s === sku);
          if (found) { pObj = found; break; }
        }
      }

      if (!pObj) return;

      const pres = statePresentacion[sku] || 'caja';
      let precioUnit = pObj.p || 0;
      if (pres === 'unidad' && pObj.pUnidadDetal) precioUnit = pObj.pUnidadDetal;

      const existingIndex = carrito.findIndex(item => item.sku === sku && item.pres === pres);
      
      if (existingIndex > -1) {
        carrito[existingIndex].cant += 1;
      } else {
        carrito.push({
          sku: sku,
          nombre: pObj.n,
          pres: pres,
          precio: precioUnit,
          cant: 1
        });
      }

      renderCarrito();
      toggleCart();
    }

    function renderCarrito() {
      const itemsContainer = document.getElementById('cartItems');
      const countLabel = document.getElementById('cartCount');
      const totalLabel = document.getElementById('cartTotal');

      if (carrito.length === 0) {
        itemsContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center; margin-top: 40px;">El carrito está vacío.</p>`;
        countLabel.textContent = '0';
        totalLabel.textContent = '$0';
        return;
      }

      itemsContainer.innerHTML = '';
      let total = 0;
      let totalItems = 0;

      carrito.forEach((item, index) => {
        const subtotal = item.precio * item.cant;
        total += subtotal;
        totalItems += item.cant;

        const el = document.createElement('div');
        el.className = 'cart-item';
        el.innerHTML = `
          <div>
            <strong style="font-size: 0.88rem; color: #fff;">${item.nombre}</strong><br>
            <span style="font-size: 0.75rem; color: var(--text-muted);">
              ${item.pres === 'caja' ? '📦 Caja (x20)' : '📍 Unidad'} x ${item.cant}
            </span>
          </div>
          <div style="text-align: right;">
            <div style="font-weight: 800; color: var(--accent); font-size: 0.9rem;">$${subtotal.toLocaleString('es-CO')}</div>
            <button onclick="eliminarDelCarrito(${index})" style="background: none; border: none; color: var(--danger); font-size: 0.75rem; cursor: pointer;">Eliminar</button>
          </div>
        `;
        itemsContainer.appendChild(el);
      });

      countLabel.textContent = totalItems;
      totalLabel.textContent = `$${total.toLocaleString('es-CO')}`;
    }

    function eliminarDelCarrito(index) {
      carrito.splice(index, 1);
      renderCarrito();
    }

    function enviarPedidoWhatsApp() {
      if (carrito.length === 0) return alert('El carrito está vacío.');

      const phone = '573215893452'; // Manteniendo el número de WhatsApp
      const pago = document.getElementById('paymentMethod').value;
      let msg = `🛒 *NUEVO PEDIDO DESDE LA WEB*\n\n`;

      let total = 0;
      carrito.forEach(item => {
        const sub = item.precio * item.cant;
        total += sub;
        msg += `• *${item.nombre}*\n  Presentación: ${item.pres === 'caja' ? '📦 Caja (x20)' : '📍 Unidad'} | Cantidad: ${item.cant} | Subtotal: $${sub.toLocaleString('es-CO')}\n\n`;
      });

      msg += `💳 *Método de Pago Preferido:* ${pago}\n`;
      msg += `💰 *TOTAL ESTIMADO:* $${total.toLocaleString('es-CO')}\n\n`;
      msg += `¡Hola! Quisiera confirmar la disponibilidad para envío de este pedido.`;

      const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    }

    window.onload = init;
  </script>
</body>
</html>
